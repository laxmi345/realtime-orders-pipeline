name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install flake8 pytest

      - name: Lint
        run: flake8 producer spark dashboard tests --max-line-length=120

      - name: Unit tests
        run: pytest -q

      - name: Build Docker images
        run: docker compose build
